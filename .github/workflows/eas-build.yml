name: EAS Build APK

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          # Mặc định action này cài eas-cli bằng yarn — repo chỉ dùng npm (không có yarn.lock),
          # và yarn global add đang fail trên runner (exit code 1, có thể do runner đổi Node mặc
          # định lên 24 chưa tương thích với yarn classic cũ). Đổi sang npm — đường đã dùng thành
          # công cho "Install dependencies" ở bước trên.
          packager: npm

      - name: Build APK
        run: eas build -p android --profile preview --non-interactive
